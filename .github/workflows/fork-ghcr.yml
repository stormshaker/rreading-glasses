name: Fork Image (ghcr.io)

# Builds this fork's patched Hardcover server and publishes it to ghcr.io so
# the NAS can pull it directly. amd64 only: the box that runs it is x86_64.
# Kept to this one file so the fork's changes to upstream code stay reviewable
# on their own.

on:
  push:
    branches:
      - main
      - 'seta/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/rreading-glasses:hardcover-${branch}"
            echo "ghcr.io/${{ github.repository_owner }}/rreading-glasses:hardcover-${branch}-${{ github.run_number }}"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/rreading-glasses:hardcover"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: RGPATH=./cmd/rghc
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
